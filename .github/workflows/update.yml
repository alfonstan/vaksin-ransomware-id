name: Update data ransomware Indonesia

on:
  schedule:
    - cron: "17 */6 * * *"   # tiap 6 jam (UTC) — 00:17, 06:17, 12:17, 18:17
  workflow_dispatch:
    inputs:
      days:
        description: "Jumlah hari yang diambil (365 = isi ulang 12 bulan)"
        default: "3"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ambil & olah data RansomLook
        run: python scripts/update.py --days "${{ github.event.inputs.days || '3' }}"
      - name: Simpan perubahan
        run: |
          git config user.name "vaksincom-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/data state
          if git diff --cached --quiet; then echo "Tidak ada perubahan"; exit 0; fi
          git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase -X theirs origin main || git pull --rebase origin main
          git push
